name: Refresh iNaturalist Token

on:
  schedule:
    - cron: '0 5 * * *'   # 5 AM UTC daily (before North American daytime)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright && playwright install chromium --with-deps

      - name: Refresh token and update Cloud Run
        env:
          INAT_USERNAME: ${{ secrets.INAT_USERNAME }}
          INAT_PASSWORD: ${{ secrets.INAT_PASSWORD }}
          GCP_PROJECT:   birding-app-1a446
          GCP_REGION:    us-central1
          CLOUD_RUN_SVC: birdvision
        run: python scripts/refresh_inat_token.py
